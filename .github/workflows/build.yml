name: build

# Builds the app for Windows, macOS and Linux. Push a tag (v1.0.0) to attach the
# three builds to a GitHub release; every push/PR also builds and runs the tests.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: WL20-Attendance-Exporter-windows
          - os: macos-latest
            artifact: WL20-Attendance-Exporter-macos
          - os: ubuntu-latest
            artifact: WL20-Attendance-Exporter-linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      # Qt needs these at runtime; they ship with any desktop Linux but the
      # hosted runner image is a server and does not have them.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
                                  libfontconfig1 libglib2.0-0

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build the app
        run: pyinstaller packaging/wl20-exporter.spec --noconfirm

      - name: Verify the frozen app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./"dist/WL20 Attendance Exporter.app/Contents/MacOS/WL20-Attendance-Exporter" --selftest
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/WL20-Attendance-Exporter.exe --selftest
          else
            ./dist/WL20-Attendance-Exporter --selftest
          fi

      # Fallback for locked-down Windows machines where antivirus blocks the
      # single-file build's self-extraction ("Could not load PyInstaller's
      # embedded PKG archive from the executable").
      - name: Build folder variant (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WL20_ONEDIR: "1"
        run: |
          pyinstaller packaging/wl20-exporter.spec --noconfirm \
            --distpath dist-folder --workpath build-folder
          ./dist-folder/WL20-Attendance-Exporter/WL20-Attendance-Exporter.exe --selftest
          powershell -Command "Compress-Archive -Path 'dist-folder/WL20-Attendance-Exporter' -DestinationPath 'dist/WL20-Attendance-Exporter-windows-folder.zip' -Force"
          ls -la dist

      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src\wl20_exporter\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Host "Inno Setup missing from the image - installing it"
            choco install innosetup --no-progress -y
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=$version" "packaging\windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\*Setup*.exe | Format-Table Name, Length

      - name: Verify the installer (silent install, then the app's own selftest)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*Setup*.exe | Select-Object -First 1).FullName
          Write-Host "installing $setup"
          $proc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "installer exited $($proc.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\WL20 Attendance Exporter"
          $exe = Join-Path $dir "WL20-Attendance-Exporter.exe"
          if (!(Test-Path $exe)) { throw "installer did not place the app in $dir" }
          if (!(Test-Path (Join-Path $dir "unins000.exe"))) { throw "no uninstaller was created" }
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "the installed app failed its selftest" }
          Write-Host "installed and verified at $dir"

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg-staging
          cp -R "dist/WL20 Attendance Exporter.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "WL20 Attendance Exporter" -srcfolder dmg-staging \
            -ov -format UDZO "dist/WL20-Attendance-Exporter-macos.dmg"
          ls -la dist

      - name: Verify the DMG (mount, run the app's selftest)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach "dist/WL20-Attendance-Exporter-macos.dmg" -nobrowse -mountpoint /tmp/wl20dmg
          ls -la /tmp/wl20dmg
          /tmp/wl20dmg/"WL20 Attendance Exporter.app"/Contents/MacOS/WL20-Attendance-Exporter --selftest
          hdiutil detach /tmp/wl20dmg

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # macOS ships as the .app bundle only: the loose Mach-O binary would
          # otherwise be uploaded under the same asset name as the Linux build
          # (the two jobs run in parallel), so remove it before packaging.
          rm -f "WL20-Attendance-Exporter"
          zip -r -y "WL20-Attendance-Exporter-macos.zip" "WL20 Attendance Exporter.app"
          shasum -a 256 "WL20-Attendance-Exporter-macos.zip" > SHA256SUMS-${{ matrix.artifact }}.txt
          shasum -a 256 "WL20-Attendance-Exporter-macos.dmg" >> SHA256SUMS-${{ matrix.artifact }}.txt

      - name: Package (Windows / Linux binary)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd dist
          # Per-platform file: all three jobs run in parallel, so a shared
          # SHA256SUMS.txt would be overwritten by whichever finishes last.
          for file in WL20-Attendance-Exporter*; do
            echo "$(sha256sum "$file" | cut -d' ' -f1)  $file" >> "SHA256SUMS-${{ matrix.artifact }}.txt"
          done
          cat "SHA256SUMS-${{ matrix.artifact }}.txt"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/WL20-Attendance-Exporter*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WL20-Attendance-Exporter*
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
